<!doctype html>
<html lang="en">
  <head>
    <title>Anvesha Media Uploader</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="depend/styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <!-- Fullscreen Drag & Drop Target -->
    <div id="drop-zone" class="anv-drop-surface">
      <div class="anv-drop-overlay-indicator" aria-hidden="true">
        <div class="anv-overlay-box">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v13" />
            <path d="M6 11l6 6 6-6" />
            <path d="M4 21h16" />
          </svg>
          <p>Drop to upload</p>
        </div>
      </div>

      <header class="anv-header">
        <div class="anv-container">
          <h1 class="anv-title">Media Uploader</h1>

          <div class="anv-field-group">
            <label for="gh-token">GitHub token</label>
            <input
              type="password"
              id="gh-token"
              placeholder="github_pat_... or ghp_..."
              autocomplete="off"
            />
          </div>
        </div>
      </header>

      <main class="anv-main">
        <div class="anv-container">
          <!-- Screen-wide Drop Panel Prompt -->
          <div class="anv-drop-prompt" id="drop-trigger">
            <svg class="anv-drop-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v13" />
              <path d="M6 11l6 6 6-6" />
              <path d="M4 21h16" />
            </svg>
            <p class="anv-drop-title">Drag &amp; drop files anywhere</p>
            <p class="anv-drop-text">or <span class="anv-browse-link">browse from your computer</span></p>
            <input type="file" id="file-input" class="anv-file-hidden" multiple />
          </div>

          <!-- Staging / Commits Queue -->
          <div id="status-container" class="anv-status-container"></div>
        </div>
      </main>

      <!-- Always pinned to bottom -->
      <footer class="anv-bottom-banner">
        <img src="/depend/header.png" alt="Footer Banner" />
      </footer>
    </div>

    <script src="depend/upload.js" defer></script>
  </body>
</html>
