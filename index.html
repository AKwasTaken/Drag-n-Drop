<!doctype html>
<html lang="en">
  <head>
    <title>Anvesha Media Uploader</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="depend/styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <!-- Fullscreen Drag & Drop Target -->
    <div id="drop-zone" class="anv-drop-surface">
      <div class="anv-drop-overlay-indicator" aria-hidden="true">
        <div class="anv-overlay-box">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3v13" />
            <path d="M6 11l6 6 6-6" />
            <path d="M4 21h16" />
          </svg>
          <p>Drop to upload</p>
        </div>
      </div>

      <!-- Completely isolated clean header -->
      <header class="anv-header">
        <div class="anv-container">
          <h1 class="anv-title">Anvesha Media</h1>

          <div class="anv-field-group">
            <label for="gh-token">GitHub token</label>
            <input
              type="password"
              id="gh-token"
              placeholder="github_pat_... or ghp_..."
              autocomplete="off"
            />
          </div>
        </div>
      </header>

      <!-- Main workspace: footer graphic lives strictly inside here -->
      <main class="anv-main">
        <div class="anv-container">
          <!-- Screen-wide Drop Panel Prompt -->
          <div class="anv-drop-prompt" id="drop-trigger">
            <svg
              class="anv-drop-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 3v13" />
              <path d="M6 11l6 6 6-6" />
              <path d="M4 21h16" />
            </svg>
            <p class="anv-drop-title">Drag &amp; drop files anywhere</p>
            <p class="anv-drop-text">
              or <span class="anv-browse-link">browse from your computer</span>
            </p>
            <input
              type="file"
              id="file-input"
              class="anv-file-hidden"
              multiple
            />
          </div>

          <!-- Opens the preview modal for whatever's currently selected/dropped -->
          <button
            type="button"
            id="review-upload-btn"
            class="anv-primary-btn"
            disabled
          >
            Review &amp; Upload
            <span id="staged-count" class="anv-btn-count" hidden>0</span>
          </button>

          <!-- Staging / Commits Queue -->
          <div id="status-container" class="anv-status-container"></div>
        </div>

        <!-- Pinned strictly inside main; cut off by main's top edge -->
        <footer class="anv-bottom-banner">
          <img src="depend/footer.png" alt="Footer Banner" />
        </footer>
      </main>
    </div>

    <!-- Preview / confirm modal -->
    <div id="preview-modal" class="anv-modal-overlay" hidden>
      <div
        class="anv-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="anv-modal-title"
      >
        <div class="anv-modal-head">
          <h2 id="anv-modal-title">Review before upload</h2>
          <p class="anv-modal-sub">
            These files will be committed to the repository.
          </p>
        </div>
        <div class="anv-modal-body" id="modal-preview-list"></div>
        <div class="anv-modal-foot">
          <button type="button" id="modal-cancel-btn" class="anv-btn-ghost">
            Cancel
          </button>
          <button type="button" id="modal-upload-btn" class="anv-btn-primary">
            Upload
          </button>
        </div>
      </div>
    </div>

    <script src="depend/upload.js" defer></script>
  </body>
</html>
